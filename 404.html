<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        let url = window.location.href;
        let newUrl = url.replace("cards.hop.ie", "cardso.me");
        console.log(newUrl);
        let meta = document.createElement("meta");
        meta.httpEquiv = "refresh";
        meta.content = `20;url=${newUrl}`;
        document.head.appendChild(meta);

        document.addEventListener("DOMContentLoaded", function () {
          let link = document.getElementById("redirect-link");
          link.href = newUrl;
        });
      })();
    </script>
  </head>
  <body>
    <h1>Cardsome</h1>
    <p>
      You are being redirected to the new URL. If you are not redirected,
      <a id="redirect-link" href="#">click here</a>.
    </p>
  </body>
</html>
