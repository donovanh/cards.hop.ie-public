        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #222;
      }

      body > * {
        --layout-spacing: max(8vh, 1rem);
        --max-width: 70ch;
        width: min(100%, var(--max-width));
        margin-left: auto;
        margin-right: auto;
      }

      main {
        margin: 0 auto;
        max-width: 80em;
        width: 100%;
      }

      main p {
        margin: 1rem 0 0;
      }

      footer {
        margin-top: auto;
        padding-top: var(--layout-spacing);
      }

      footer p {
        border-top: 1px solid #ccc;
        padding-top: 0.25em;
        font-size: 0.9rem;
        color: #767676;
      }

      :is(h1, h2, h3) {
        line-height: 1.2;
      }

      :is(h2, h3):not(:first-child) {
        margin-top: 2em;
      }

      article * + * {
        margin-top: 1em;
      }

      a {
        color: navy;
        text-underline-offset: 0.15em;
      }

      h2 {
        font-size: 22px;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      label {
        display: block;
        font-size: 22px;
      }

      input,
      textarea {
        border: 2px solid #ccc;
        border-radius: 4px;
        box-shadow: inset 0 1px 3px #ddd;
        box-sizing: border-box;
        display: inline-block;
        font-size: 18px;
        padding: 1em 1.25em;
        vertical-align: middle;
        margin: 0.5em 0;
      }

      button {
        cursor: pointer;
        display: inline-block;
        line-height: normal;
        vertical-align: middle;
        white-space: nowrap;
        -webkit-user-drag: none;
        box-sizing: border-box;
        user-select: none;
        background-color: #e6e6e6;
        border: #0000;
        border-radius: 2px;
        color: #000c;
        font-size: 100%;
        padding: 0.5em 1em;
      }

      button:disabled {
        opacity: 0.2;
      }

      .button-success,
      .button-error,
      .button-warning,
      .button-secondary {
        color: white;
        border-radius: 4px;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
      }

      .button-success {
        background: rgb(28, 184, 65);
      }

      .button-error {
        background: rgb(202, 60, 60);
      }

      .button-warning {
        background: rgb(223, 117, 20);
      }

      .button-secondary {
        background: rgb(66, 184, 221);
      }

      .text-button {
        background: none;
        padding: 0;
      }
    </style>
